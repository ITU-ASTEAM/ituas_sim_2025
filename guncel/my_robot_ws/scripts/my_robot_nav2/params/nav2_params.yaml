bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 120.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.5   # su ortamı: 1m makul
      yaw_goal_tolerance: 3.14  # yaw ignore
      stateful: true

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      # --- HIZLAR ---
      desired_linear_vel: 0.8
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 8.0

      # --- LOOKAHEAD (KRİTİK: path'e sadık kalmak için küçült) ---
      lookahead_dist: 2.0        # <<< 4.0→1.5: path'i daha yakından takip et
      min_lookahead_dist: 1.5    # <<< 3.0→1.0: minimum lookahead küçük olsun
      max_lookahead_dist: 3.0    # <<< 8.0→3.0: çok uzağa bakmasın, viraj kesilmesin
      lookahead_time: 1.5        # <<< 2.0→1.5
      use_velocity_scaled_lookahead_dist: true

      # --- DÖNÜŞ ---
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 0.4
      rotate_to_heading_min_angle: 1.57  # <<< 1.0→0.8: daha erken dönmeye başlasın
      max_angular_accel: 0.3

      # --- ÇARPIŞMA / ÖLÇEKLEME ---
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5  # lookahead ile uyumlu
      use_regulated_linear_velocity_scaling: true
      use_fixed_curvature_lookahead: false
      curvature_feedback_gain: 3.5   # <<< 2.5→3.5: virajlarda daha agresif yavaşlasın
      inflation_cost_scaling_factor: 0.5
      regulated_linear_scaling_min_radius: 1.0  # <<< 1.5→1.0: dar virajlarda daha çok yavaşlasın
      regulated_linear_scaling_min_speed: 0.05

      # --- DİĞER ---
      transform_tolerance: 1.0
      allow_reversing: false
      max_robot_pose_search_dist: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 20
      height: 20
      resolution: 0.2
      robot_radius: 0.65
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: detected_buoys
        detected_buoys:
          topic: /detected_buoys
          data_type: PointCloud2
          marking: true
          clearing: true
          max_obstacle_height: 2.0
          min_obstacle_height: -0.5
          obstacle_max_range: 50.0
          obstacle_min_range: 0.0
          raytrace_max_range: 50.0
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 1.0
        inflation_radius: 1.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.65
      resolution: 0.2
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: detected_buoys
        detected_buoys:
          topic: /detected_buoys
          data_type: PointCloud2
          marking: true
          clearing: true
          max_obstacle_height: 2.0
          min_obstacle_height: -0.5
          obstacle_max_range: 50.0
          obstacle_min_range: 0.0
          raytrace_max_range: 50.0
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 1.0
        inflation_radius: 1.0
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 1.0
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.4
    min_rotational_vel: 0.1
    rotational_acc_lim: 0.8

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: true
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true
